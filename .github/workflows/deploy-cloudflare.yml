name: Deploy SVS V26 Multi-Site to Cloudflare Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    # Will run only AFTER repository variables / secrets are configured.
    if: ${{ vars.CF_PAGES_PROJECT_NAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - name: Publish Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT_NAME }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CF_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CF_ACCOUNT_ID" && exit 1)
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main
