name: Deploy SVS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: svs-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all six static sites
        run: npm run build
        env:
          SVS_BASE_PATH: ${{ vars.SVS_BASE_PATH || '/SVS/' }}
      - name: Verify links, assets and all sites
        run: npm test
      - name: Inspect Pages output
        run: |
          test -s dist/index.html
          test -s dist/medicalcollege/index.html
          test -s dist/medicalhospital/index.html
          test -s dist/dentalcollege/index.html
          test -s dist/dentalhospital/index.html
          test -s dist/nursingcollege/index.html
          test -s dist/assets/official/svs-campus-aerial.mp4
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
