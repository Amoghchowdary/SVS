name: Verify SVS Website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static routes for GitHub Pages
        run: npm run build
        env:
          SVS_BASE_PATH: /SVS/
      - name: Verify all six websites and assets
        run: npm test
      - name: Archive GitHub Pages build
        uses: actions/upload-artifact@v4
        with:
          name: svs-v27-pages-build
          path: dist/
          include-hidden-files: true
          retention-days: 7
